name: test

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow starts this for the release PR, because a PR opened with GITHUB_TOKEN gets no normal CI.
  workflow_dispatch:
  workflow_call:
    inputs:
      gate:
        description: Run as the release gate, so only the check job runs.
        type: boolean
        default: false
      os:
        type: string
        default: ubuntu-latest

permissions:
  contents: read

# A gate run gets its own group, so its two operating systems do not cancel each other.
concurrency:
  group: ${{ inputs.gate && format('gate-{0}-{1}', github.run_id, inputs.os) || format('test-{0}', github.ref) }}
  cancel-in-progress: ${{ !inputs.gate && github.ref != 'refs/heads/main' }}

jobs:
  # The ruleset on main requires guard and check by name. Keep both names.
  guard:
    if: ${{ !inputs.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
      - name: Check that no private data entered the repository
        run: |
          set -u
          # Reply text from a model can echo the name of the account that ran a check. Result files must not store it.
          if grep -rIlE '"text":' bench/results/*.json 2>/dev/null; then
            echo "A result file stores reply text. Remove the text field."; exit 1
          fi
          # Absolute paths of a person's machine.
          if grep -rInE '/Users/[a-z][a-z0-9_-]+/|/home/[a-z][a-z0-9_-]+/' . \
              --exclude-dir=.git --exclude-dir=upstream --exclude-dir=node_modules --exclude=package-lock.json \
              | grep -vE '/Users/(sam|a|u|x|you|name)/|/home/(u|runner)/'; then
            echo "Found a personal path."; exit 1
          fi
          echo "ok"
      - name: Check the pull request rules
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_FORK: ${{ github.event.pull_request.head.repo.fork }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node tools/release.mts rules
      - name: Find out whether code changed
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REF: ${{ github.ref }}
        run: node tools/release.mts scope

  # This job skips with an if, not with paths-ignore. A required check under paths-ignore stays pending forever.
  check:
    needs: guard
    if: ${{ !cancelled() && (needs.guard.result == 'skipped' && inputs.gate || needs.guard.result == 'success' && needs.guard.outputs.code == 'true') }}
    runs-on: ${{ inputs.os || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # Node 24 strips TypeScript types, so the tests and bench scripts run as .mts without a build step.
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Node tests
        run: npm test
      - name: Check benchmark task files
        run: node bench/validate-fixture.mts --offline
      # These two commands read and test the mod itself. They need no sign-in and no network.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the mod
        run: claude plugin validate . --strict
      - name: Test the mod
        run: claude plugin test .
      # The mods catalogue refuses a new seed with a cut calls line. See hooks/lib/io.ts.
      - name: Keep the calls line whole
        run: "! claude plugin validate . --strict | grep -E 'calls:.*\\[\\+[0-9]+ chars?\\]'"
