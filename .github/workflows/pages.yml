name: pages

# Builds the website in site/, a Fumadocs app on Next.js, and publishes the static export to GitHub Pages.
# site/scripts/assets.mjs copies the images in, so each has one source.
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/readme/**', 'brand/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build the site
        working-directory: site
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci
          npm run build
      - name: Publish alternate sitemaps
        # Search Console can fail to fetch sitemap.xml on GitHub Pages while it reads the same list under another name.
        run: |
          cp site/out/sitemap.xml site/out/sitemap-pages.xml
          grep -o '<loc>[^<]*' site/out/sitemap.xml | cut -c6- > site/out/sitemap.txt
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/out
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Notify IndexNow
        # Bing and other engines read this. A failure here must not fail a good deploy.
        continue-on-error: true
        run: |
          # The key file is the .txt file in site/public/ with a 32-character hex name.
          KEY=$(basename "$(ls site/public/*.txt | grep -E '/[0-9a-f]{32}\.txt$')" .txt)
          urls=$(grep -o '<loc>[^<]*' site/out/sitemap.xml | cut -c6- | jq -R . | jq -sc .)
          jq -n --arg key "$KEY" --argjson urls "$urls" \
            '{host: "mralexivy.github.io", key: $key, keyLocation: "https://mralexivy.github.io/AutoMode/\($key).txt", urlList: $urls}' |
            curl -sS --fail-with-body -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d @-
