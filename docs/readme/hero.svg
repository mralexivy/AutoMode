<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Illustration of the AutoMode bar: Deciding, then Low for a quick question, then High for a refactor">
  <style>
    .f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .s1,.s2,.s3{opacity:0}
    .s1{animation:a1 9s infinite}
    .s2{animation:a2 9s infinite}
    .s3{animation:a3 9s infinite}
    @keyframes a1{0%,4%{opacity:0}8%,30%{opacity:1}34%,100%{opacity:0}}
    @keyframes a2{0%,34%{opacity:0}38%,64%{opacity:1}68%,100%{opacity:0}}
    @keyframes a3{0%,68%{opacity:0}72%,96%{opacity:1}100%{opacity:0}}
    .pulse{animation:p 1.2s ease-in-out infinite}
    @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
  </style>
  <rect width="1000" height="300" rx="16" fill="#0d1020"/>
  <rect x="0" y="0" width="1000" height="36" rx="16" fill="#161a30"/>
  <rect x="0" y="20" width="1000" height="16" fill="#161a30"/>
  <circle cx="22" cy="18" r="6" fill="#fb7185"/><circle cx="42" cy="18" r="6" fill="#fbbf24"/><circle cx="62" cy="18" r="6" fill="#34d399"/>
  <text x="500" y="23" text-anchor="middle" class="m" font-size="13" fill="#8b93b8">claude</text>

  <!-- prompts -->
  <g class="m" font-size="16" fill="#e8ebff">
    <g class="s1"><text x="32" y="90">&gt; what does the cache countdown mean?</text></g>
    <g class="s2"><text x="32" y="90">&gt; what does the cache countdown mean?</text></g>
    <g class="s3"><text x="32" y="90">&gt; refactor the importer to stream rows, keep the tests green</text></g>
  </g>

  <!-- bar frame -->
  <rect x="24" y="190" width="952" height="76" rx="12" fill="#161a30" stroke="#2a3050"/>

  <!-- state 1: deciding -->
  <g class="s1 f">
    <text x="48" y="236" font-size="22" font-weight="600" fill="#8b93b8" class="pulse">Deciding…</text>
    <text x="260" y="236" font-size="16" fill="#8b93b8" class="m">judge reads the prompt</text>
  </g>
  <!-- state 2: low -->
  <g class="s2 f">
    <text x="48" y="236" font-size="22" font-weight="700" fill="#34d399">Low</text>
    <text x="104" y="236" font-size="22" fill="#e8ebff">· Haiku</text>
    <text x="260" y="236" font-size="16" fill="#8b93b8" class="m">◔ 3%   cache 59:00   a quick question</text>
    <rect x="800" y="212" width="80" height="34" rx="17" fill="#1d2244" stroke="#2a3050"/><text x="840" y="235" text-anchor="middle" font-size="15" fill="#e8ebff">Auto</text>
    <rect x="890" y="212" width="74" height="34" rx="17" fill="#1d2244" stroke="#2a3050"/><text x="927" y="235" text-anchor="middle" font-size="15" fill="#8b93b8">⚙</text>
  </g>
  <!-- state 3: high -->
  <g class="s3 f">
    <text x="48" y="236" font-size="22" font-weight="700" fill="#8b5cf6">High</text>
    <text x="112" y="236" font-size="22" fill="#e8ebff">· Opus</text>
    <text x="260" y="236" font-size="16" fill="#8b93b8" class="m">◔ 38%   cache 58:12   a refactor across modules</text>
    <rect x="800" y="212" width="80" height="34" rx="17" fill="#1d2244" stroke="#2a3050"/><text x="840" y="235" text-anchor="middle" font-size="15" fill="#e8ebff">Auto</text>
    <rect x="890" y="212" width="74" height="34" rx="17" fill="#1d2244" stroke="#2a3050"/><text x="927" y="235" text-anchor="middle" font-size="15" fill="#8b93b8">⚙</text>
  </g>
  <text x="500" y="290" text-anchor="middle" class="f" font-size="11" fill="#5b6390">Illustration. Real screenshots live in docs/readme/ once captured.</text>
</svg>
