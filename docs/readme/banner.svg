  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="224" y="166" font-size="84" font-weight="700" letter-spacing="-2" fill="#8b5cf6">Auto<tspan fill="#22d3ee">Mode</tspan></text>
    <text x="226" y="214" font-size="30" fill="#e8ebff">The right model and the right effort for every prompt.</text>
    <text x="226" y="256" font-size="22" fill="#8b93b8">An open source mod for Claude Code. Haiku explores. Opus plans and reviews. Sonnet builds.</text>
