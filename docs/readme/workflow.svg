<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" width="1100" height="340" role="img" aria-label="The AutoMode workflow: risk band, discover, plan, build, verify, review">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b93b8"/></marker>
  </defs>
  <style>
    .f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .t{font-size:20px;font-weight:700;fill:#e8ebff}
    .d{font-size:14px;fill:#8b93b8}
    .box{fill:#161a30;stroke:#2a3050;stroke-width:1.5}
  </style>
  <rect width="1100" height="340" rx="16" fill="#0d1020"/>
  <g class="f">
    <rect class="box" x="30" y="90" width="150" height="120" rx="14"/>
    <text class="t" x="105" y="128" text-anchor="middle">Risk band</text>
    <text class="d" x="105" y="156" text-anchor="middle">Code, no model</text>
    <text class="d" x="105" y="178" text-anchor="middle">S0 to S3</text>

    <rect class="box" x="215" y="90" width="150" height="120" rx="14" stroke="#34d399"/>
    <text class="t" x="290" y="128" text-anchor="middle">Discover</text>
    <text class="d" x="290" y="156" text-anchor="middle">Haiku explorer</text>
    <text class="d" x="290" y="178" text-anchor="middle">1 to 3 agents</text>

    <rect class="box" x="400" y="90" width="150" height="120" rx="14" stroke="#8b5cf6"/>
    <text class="t" x="475" y="128" text-anchor="middle">Plan</text>
    <text class="d" x="475" y="156" text-anchor="middle">Opus architect</text>
    <text class="d" x="475" y="178" text-anchor="middle">workstreams</text>

    <rect class="box" x="585" y="90" width="150" height="120" rx="14" stroke="#22d3ee"/>
    <text class="t" x="660" y="128" text-anchor="middle">Build</text>
    <text class="d" x="660" y="156" text-anchor="middle">Sonnet implementer</text>
    <text class="d" x="660" y="178" text-anchor="middle">one workstream</text>

    <rect class="box" x="770" y="90" width="150" height="120" rx="14" stroke="#22d3ee"/>
    <text class="t" x="845" y="128" text-anchor="middle">Verify</text>
    <text class="d" x="845" y="156" text-anchor="middle">Sonnet verifier</text>
    <text class="d" x="845" y="178" text-anchor="middle">code reads exit codes</text>

    <rect class="box" x="955" y="90" width="120" height="120" rx="14" stroke="#8b5cf6"/>
    <text class="t" x="1015" y="128" text-anchor="middle">Review</text>
    <text class="d" x="1015" y="156" text-anchor="middle">Opus reviewer</text>
    <text class="d" x="1015" y="178" text-anchor="middle">on risk</text>
  </g>
  <g stroke="#8b93b8" stroke-width="2" fill="none" marker-end="url(#ar)">
    <path d="M182 150H212"/><path d="M367 150H397"/><path d="M552 150H582"/><path d="M737 150H767"/><path d="M922 150H952"/>
  </g>
  <g class="f">
    <text class="d" x="550" y="270" text-anchor="middle">Verify fails: up to 2 rounds, then back to Build.</text>
    <text class="d" x="550" y="296" text-anchor="middle">Risk can only raise the band. S2 and S3 always get the Opus review.</text>
  </g>
  <path d="M845 214V246H660V214" stroke="#fbbf24" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#ar)"/>
</svg>
